[project]
name = "thinksource-mcp"
version = "0.1.0"
description = "MCP server for ThinkSource. First set: YouTube tools. More capabilities to follow."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2.0",
    "yt-dlp>=2025.1.0",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.9.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "markdown-it-py>=3.0.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
    "ddgs>=8.0.0",
]

[project.scripts]
thinksource-mcp = "thinksource_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinksource_mcp"]
